let idx=0,state='title',enemies=[],pendingMessages=[],items=[],collectedItems=[],bullets=[],splats=[],last=0,spawnClock=0,shipX=.5,frame=0,total=0,raf=0,fireClock=0,curseThreatQueued=false;

function updateHud(){el('stage').textContent=String(idx+1).padStart(2,'0');el('month').textContent=months[idx];el('remaining').textContent=state==='play'?enemies.length+pendingMessages.length:0;el('money').textContent=fmt(total);el('progress').style.width=((idx+1)/months.length*100)+'%';el('prev').disabled=idx===0;el('next').disabled=idx===months.length-1;el('tip').textContent='指で自機を左右に移動　・　レーザー自動連射'}
function makeGlyph(char,hp){const wrap=document.createElement('span');wrap.className='glyph';wrap.setAttribute('aria-hidden','true');const bitmap=document.createElement('canvas');bitmap.className='glyph-pixels';bitmap.width=20;bitmap.height=20;const g=bitmap.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#f7f7ff';g.font='18px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(char,10,10,20);const pixels=g.getImageData(0,0,20,20);for(let i=0;i<pixels.data.length;i+=4){if(pixels.data[i+3]>112){pixels.data[i]=247;pixels.data[i+1]=247;pixels.data[i+2]=255;pixels.data[i+3]=255}else pixels.data[i+3]=0}g.putImageData(pixels,0,0);wrap.appendChild(bitmap);return{el:wrap,bitmap,hp,maxHp:hp}}
function showOverlay(title,copy,button='つづける'){el('vtitle').textContent=title;el('vtext').innerHTML=copy;el('start').textContent=button;veil.classList.remove('hidden')}

function renderInventory(){const list=el('inventoryItems');list.innerHTML='';const curseReady=curseLettersComplete();for(const item of collectedItems){const slot=document.createElement('span');slot.className='inventory-item '+(item.isUp?'up':'down')+(!item.isUp&&curseReady?' blood':'');slot.textContent=item.char;slot.title=item.isUp?'パワーアップ':'呪';list.appendChild(slot)}if(curseReady)list.setAttribute('aria-label','スクワット完成');else list.removeAttribute('aria-label')}

function spawnItem(x,y){const isUp=Math.random()<.7,node=document.createElement('div');node.className='item-drop '+(isUp?'up':'down');node.textContent='?';node.setAttribute('aria-label',isUp?'パワーアップアイテム':'呪アイテム');arena.appendChild(node);const item={x:Math.max(18,Math.min(arena.clientWidth-18,x)),y,char:'',isUp,el:node};node.style.left=(item.x-17)+'px';node.style.top=(item.y-17)+'px';items.push(item)}
function hitGlyph(e,ch,x,y){if(e.unbreakable||ch.hp<=0)return;ch.hp--;const chip=document.createElement('i');chip.className='pixel-chip';const glyphSize=parseFloat(getComputedStyle(ch.el).width);chip.style.left=Math.floor(Math.random()*glyphSize)+'px';chip.style.top=Math.floor(Math.random()*glyphSize)+'px';ch.el.appendChild(chip);bloodSplatter(x,y);if(ch.hp<=0){ch.bitmap.getContext('2d').clearRect(0,0,ch.bitmap.width,ch.bitmap.height);ch.el.classList.add('destroyed');ch.el.querySelectorAll('.pixel-chip').forEach(n=>n.remove());e.liveChars--;if(e.liveChars===0){e.el.remove();enemies=[];spawnItem(x,y);spawnNextMessage()}}else{ch.el.classList.add('hit');setTimeout(()=>ch.el&&ch.el.classList.remove('hit'),80)}}
function bloodSplatter(x,y){for(let i=0;i<9;i++){const a=Math.random()*Math.PI*2,s=.7+Math.random()*2.7;splats.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:14+Math.random()*12,size:Math.random()<.72?2:3,hue:Math.random()<.18?350:Math.random()*8})}}

for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.vy*dt;let hit=false;for(const e of [...enemies]){if(e.unbreakable)continue;const rect=e.el.getBoundingClientRect(),x=rect.left-r.left,y=rect.top-r.top;if(b.x<x||b.x>x+rect.width||b.y<y||b.y>y+rect.height)continue;for(const ch of e.chars){if(ch.hp<=0)continue;const cr=ch.el.getBoundingClientRect();if(b.x<cr.left-r.left||b.x>cr.right-r.left||b.y<cr.top-r.top||b.y>cr.bottom-r.top)continue;hitGlyph(e,ch,b.x,b.y);hit=true;break}if(hit)break}if(hit||b.y<0)bullets.splice(i,1)}
for(const item of [...items]){item.y+=2.2*dt;item.el.style.top=(item.y-17)+'px';if(Math.abs(item.x-shipX*r.width)<24&&Math.abs(item.y-shipY)<22){const word=Array.from(item.isUp?'養育費履行勧告':'スクワット');item.char=word[Math.floor(Math.random()*word.length)];collectedItems.push(item);renderInventory();item.el.remove();items=items.filter(v=>v!==item);queueCurseThreat();el('status').textContent=item.isUp?'POWER UP':'呪';if(beamMode)fireClock=0}else if(item.y>shipY+30){item.el.remove();items=items.filter(v=>v!==item)}}
ctx.clearRect(0,0,r.width,r.height);if(beamMode){const grad=ctx.createLinearGradient(shipX*r.width,shipY,target?target.x:shipX*r.width, target?target.y:0);grad.addColorStop(0,'#ff426f');grad.addColorStop(.2,'#ffbd45');grad.addColorStop(.4,'#8df45f');grad.addColorStop(.6,'#48efff');grad.addColorStop(.8,'#6c78ff');grad.addColorStop(1,'#ed72ff');ctx.strokeStyle=grad;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(shipX*r.width,shipY);ctx.lineTo(target?target.x:shipX*r.width,target?target.y:0);ctx.stroke()}for(const s of splats){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;ctx.fillStyle=`hsla(${s.hue},90%,48%,${Math.max(0,s.life/26)})`;ctx.fillRect(Math.round(s.x),Math.round(s.y),s.size,s.size)}splats=splats.filter(s=>s.life>0);for(const b of bullets){ctx.fillStyle=`hsl(${b.hue} 100% 67%)`;ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1)}ship.style.left=(shipX*100)+'%';updateHud();if(!enemies.length&&!pendingMessages.length&&!items.length){clearStage();return}raf=requestAnimationFrame(tick)}
function clearStage(){state='clear';total+=30000;el('status').textContent='送信済み';updateHud();const lastStage=idx===months.length-1;showOverlay(lastStage?'全ステージクリア！':'養育費 ¥30,000 GET！',lastStage?`21か月分、合計 <span class="award">${fmt(total)}</span> を取り戻した。すべての言い訳を撃破！`:`${months[idx]}の言い訳をすべて撃破。<br><span class="award">養育費 ${fmt(30000)} を獲得！</span><br>累計 ${fmt(total)}`,lastStage?'最初から遊ぶ':'次の月へ');mainBtn.textContent='クリア';}
function move(clientX){const r=arena.getBoundingClientRect();shipX=Math.max(.04,Math.min(.96,(clientX-r.left)/r.width))}
arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture(e.pointerId)});arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')shipX=Math.max(.04,shipX-.035);if(e.key==='ArrowRight'||e.key==='d')shipX=Math.min(.96,shipX+.035);if(e.key===' '&&state==='play')pause()});
function pause(){if(state==='play'){state='pause';cancelAnimationFrame(raf);showOverlay('一時停止','指で左右に動いて、メッセージを狙おう。','再開');mainBtn.textContent='再開'}else if(state==='pause')startStage()}
el('start').addEventListener('click',()=>{if(state==='title'){state='ready';startStage()}else if(state==='clear'){if(idx<months.length-1)idx++;else{idx=0;total=0}startStage()}else if(state==='over')startStage();else if(state==='pause')startStage()});
mainBtn.addEventListener('click',()=>{if(state==='play')pause();else if(state==='clear'){if(idx<months.length-1){idx++;startStage()}else{idx=0;total=0;showOverlay('言い訳を、撃ち落とせ。','届き続けるメッセージを、虹色レーザーですべて破壊しよう。指で自機を動かして、養育費3万円を取り戻せ。','ゲームを始める');state='title'}}else startStage()});
el('prev').addEventListener('click',()=>{if(state==='play')return;idx=Math.max(0,idx-1);updateHud()});el('next').addEventListener('click',()=>{if(state==='play')return;idx=Math.min(months.length-1,idx+1);updateHud()});
updateHud();
})();
