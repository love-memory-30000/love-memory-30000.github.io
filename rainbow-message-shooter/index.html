ctx.clearRect(0,0,w,h);if(rivalCraft){const cy=h*.42+(Math.sin(frame*.055)*8);rivalCraft.style.left=(w*.5+Math.sin(frame*.025)*w*.32)+'px';rivalCraft.style.top=cy+'px';const sx=parseFloat(rivalCraft.style.left),sy=cy+9,ey=Math.max(sy,shipY-4),pulse=(Math.sin(frame*.12)+1)/2;const sludge=ctx.createLinearGradient(sx,sy,shipX*w,ey);sludge.addColorStop(0,'rgba(118,28,77,.88)');sludge.addColorStop(.45,'rgba(90,39,78,.9)');sludge.addColorStop(1,'rgba(147,40,83,.85)');ctx.strokeStyle=sludge;ctx.lineCap='round';ctx.lineWidth=5+pulse*4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+(shipX*w-sx)*.3+Math.sin(frame*.08)*18,sy+(ey-sy)*.3,sx+(shipX*w-sx)*.7-Math.sin(frame*.06)*15,sy+(ey-sy)*.75,shipX*w,ey);ctx.stroke();ctx.fillStyle='rgba(183,54,108,.56)';for(let i=0;i<9;i++){const t=(i/9+frame*.006)%1,x=sx+(shipX*w-sx)*t+Math.sin(frame*.06+i)*6,y=sy+(ey-sy)*t;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill()}}if(beamMode){let endX=beamBlock?beamBlock.x:(target?target.x:shipX*w),endY=beamBlock?beamBlock.y:(target?target.y:0);if(target&&target.e.boss){const br=target.e.el.getBoundingClientRect(),edge=br.bottom-r.top,t=(edge-shipY)/(endY-shipY);if(t>=0&&t<=1){endX=shipX*w+(endX-shipX*w)*t;endY=edge}}const grad=ctx.createLinearGradient(shipX*w,shipY,endX,endY);for(const [at,color] of [[0,'#ff426f'],[.2,'#ffbd45'],[.4,'#8df45f'],[.6,'#48efff'],[.8,'#6c78ff'],[1,'#ed72ff']])grad.addColorStop(at,color);ctx.strokeStyle=grad;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(shipX*w,shipY);ctx.lineTo(endX,endY);ctx.stroke()}if(laserMode){ctx.lineWidth=1;ctx.lineCap='round';for(const trace of laserAfterimages){ctx.strokeStyle='hsl('+trace.hue+' 100% 62%)';ctx.globalAlpha=.3*Math.min(1,trace.life/3);ctx.beginPath();ctx.moveTo(trace.x,trace.y1);ctx.lineTo(trace.x,trace.y2);ctx.stroke()}ctx.globalAlpha=1;for(const bolt of laserBolts){ctx.fillStyle='hsl('+bolt.hue+' 100% 68%)';ctx.fillRect(Math.round(bolt.x),Math.round(bolt.y),1,4)}laserAfterimages.forEach(trace=>trace.life-=dt);l function clearStage(){playSfx('clear');clearCrisis();state='clear';total+=30000;el('status').textContent='送信済み';updateHud();const lastStage=idx===months.length-1;showOverlay(lastStage?'全ステージクリア！':'養育費 ¥30,000 GET！',lastStage?`21か月分、合計 <span class="award">${fmt(total)}</span> を取り戻した。すべてのボスを押し返した！`:`${months[idx]}の脅迫ボスを上端まで押し返した。<br><span class="award">養育費 ${fmt(30000)} を獲得！</span><br>累計 ${fmt(total)}`,lastStage?'最初から遊ぶ':'次の月へ');mainBtn.textContent='クリア';}

function updateAutoTarget(r,w,shipY){if(!autoPlay||performance.now()<autoTargetHoldUntil)return;let tx=null;if(items.length){let best=Infinity;for(const item of items){const d=Math.abs(item.x-shipX*w)+Math.abs(item.y-shipY)*.45;if(d<best){best=d;tx=item.x}}}else{let best=Infinity;for(const e of enemies){if(e.liveChars===0&&e.frameHp>0){const q=e.el.getBoundingClientRect();tx=q.left-r.left+2;best=0;break}for(const ch of e.chars){if(ch.hp<=0)continue;const q=ch.el.getBoundingClientRect(),x=(q.left+q.right)/2-r.left,y=(q.top+q.bottom)/2-r.top,d=Math.abs(x-shipX*w)+Math.max(0,shipY-y)*.12;if(d<best){best=d;tx=x}}}}if(tx!==null)targetShipX=Math.max(.04,Math.min(.96,tx/w))}
