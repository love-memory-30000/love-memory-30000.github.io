function spawnItem(x,y){const upPool=upLetters.filter(ch=>!usedItemLetters.has(ch)),cursePool=curseLetters.filter(ch=>!usedItemLetters.has(ch));if(!upPool.length&&!cursePool.length)return;const isUp=upPool.length&&cursePool.length?Math.random()<.7:!!upPool.length,pool=isUp?upPool:cursePool,char=pool[Math.floor(Math.random()*pool.length)];usedItemLetters.add(char);const node=document.createElement('div'),mark=document.createElement('span');node.className='item-drop';mark.textContent='?';node.setAttribute('aria-label','アイテム');node.appendChild(mark);arena.appendChild(node);const speed=2.2+Math.random()*1.2,angle=(Math.random()-.5)*Math.PI/2;const item={x:Math.max(17,Math.min(arena.clientWidth-17,x)),y:Math.max(17,Math.min(arena.clientHeight-17,y)),vx:Math.sin(angle)*speed,vy:Math.cos(angle)*speed,char,isUp,el:node};node.style.left=(item.x-17)+'px';node.style.top=(item.y-17)+'px';items.push(item)}
function hslRgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))]}function colorizeBoss(e){const progress=Math.min(1,e.damage/e.maxDamage);e.chars.forEach((ch,i)=>{const g=ch.bitmap.getContext('2d'),image=g.getImageData(0,0,ch.bitmap.width,ch.bitmap.height),hue=(i/Math.max(1,e.chars.length)*300+progress*420)%360,rgb=hslRgb(hue,100,62-progress*8);for(let p=0;p<image.data.length;p+=4)if(image.data[p+3]){image.data[p]=Math.round(255+(rgb[0]-255)*progress);image.data[p+1]=Math.round(255+(rgb[1]-255)*progress);image.data[p+2]=Math.round(255+(rgb[2]-255)*progress)}g.putImageData(image,0,0)});e.el.style.boxShadow=`3px 3px 0 #080a11,0 0 ${6+progress*22}px hsla(${progress*420%360},100%,60%,.85)`}function hitGlyph(e,ch,x,y){if(ch.hp<=0)return;if(e.boss){e.damage=Math.min(e.maxDamage,e.damage+1);colorizeBoss(e);bloodSplatter(x,y);if(e.damage%8===0)spawnItem(x,y);return}if(e.unbreakable)return;ch.hp--;const chip=document.createElement('i');chip.className='pixel-chip';const glyphSize=parseFloat(getComputedStyle(ch.el).width);chip.style.left=Math.floor(Math.random()*glyphSize)+'px';chip.style.top=Math.floor(Math.random()*glyphSize)+'px';ch.el.appendChild(chip);bloodSplatter(x,y);if(ch.hp<=0){ch.bitmap.getContext('2d').clearRect(0,0,ch.bitmap.width,ch.bitmap.height);ch.el.classList.add('destroyed');ch.el.querySelectorAll('.pixel-chip').forEach(n=>n.remove());e.liveChars--;if(e.liveChars===0){e.el.remove();enemies=[];if(!bossQueued)spawnItem(x,y);spawnNextMessage()}}else{e.el.classList.add('hit');setTimeout(()=>e.el&&e.el.classList.remove('hit'),80)} }
function bloodSplatter(x,y){for(let i=0;i<9;i++){const a=Math.random()*Math.PI*2,s=.7+Math.random()*2.7;splats.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:14+Math.random()*12,size:Math.random()<.72?2:3,hue:Math.random()<.18?350:Math.random()*8})}}
function queueBoss(){if(bossQueued||!curseLettersComplete())return;bossQueued=true;pendingMessages=[];for(const e of enemies)e.el.remove();enemies=[];spawnNextMessage()}
function homingTarget(r){let target=null,best=Infinity;const sx=shipX*r.width,sy=r.height-94;for(const e of enemies){for(const ch of e.chars){if(ch.hp<=0)continue;const q=ch.el.getBoundingClientRect(),x=(q.left+q.right)/2-r.left,y=(q.top+q.bottom)/2-r.top,d=(x-sx)**2+(y-sy)**2;if(d<best){best=d;target={e,ch,x,y}}}}return target}
function tick(now){if(state!=='play')return;const dt=Math.min((now-last)/16.67,2);last=now;frame++;const r=arena.getBoundingClientRect(),w=r.width,h=r.height,playH=messagesEl.clientHeight,shipY=h-94;spawnClock+=dt;const owned=new Set(collectedItems.filter(it=>it.isUp).map(it=>it.char)),powerLevel=upLetters.filter(ch=>owned.has(ch)).length,shotGap=12*Math.max(0,1-powerLevel/7),sevenRayMode=powerLevel===7,beamMode=idx===20&&!sevenRayMode;if(sevenRayMode&&sevenRays.length===0){for(let i=0;i<7;i++){const angle=(-150+i*20)*Math.PI/180,speed=4.2+i%3*.35;sevenRays.push({x:shipX*w,y:shipY,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,hue:i*51})}}if(sevenRayMode)bullets=[];else if(beamMode)bullets=[];else if(shotGap<=0){bullets.push({x:shipX*w,y:shipY-6,vy:8,hue:(frame*7)%360})}else{fireClock+=dt;while(fireClock>=shotGap){fireClock-=shotGap;bullets.push({x:shipX*w,y:shipY-6,vy:8,hue:(frame*7)%360})}}
for(const e of enemies){e.y+=(.28+idx*.018)*dt;e.el.style.top=e.y+'px';if(e.y>playH-22){if(e.boss){clearStage();return}state='over';showOverlay('メッセージに押し切られた…',`${months[idx]}の言い訳が届いてしまった。もう一度、全部撃ち落とそう。`,'リトライ');el('status').textContent='未読';updateHud();return}}
let target=null;if(beamMode){target=homingTarget(r);for(const e of enemies)for(const ch of e.chars)ch.beamCooldown=Math.max(0,ch.beamCooldown-dt);if(target&&target.ch.beamCooldown<=0){hitGlyph(target.e,target.ch,target.x,target.y);target.ch.beamCooldown=4}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.vy*dt;let hit=false;for(const e of [...enemies]){if(e.unbreakable&&!e.boss)continue;const rect=e.el.getBoundingClientRect(),x=rect.left-r.left,y=rect.top-r.top;if(b.x<x||b.x>x+rect.width||b.y<y||b.y>y+rect.height)continue;for(const ch of e.chars){if(ch.hp<=0)continue;const cr=ch.el.getBoundingClientRect();if(b.x<cr.left-r.left||b.x>cr.right-r.left||b.y<cr.top-r.top||b.y>cr.bottom-r.top)continue;hitGlyph(e,ch,b.x,b.y);hit=true;break}if(hit)break}if(hit||b.y<0)bullets.splice(i,1)}
if(sevenRayMode){for(let i=0;i<sevenRays.length;i++){const ray=sevenRays[i],x1=ray.x,y1=ray.y;ray.x+=ray.vx*dt;ray.y+=ray.vy*dt;if(ray.x<1){ray.x=1;ray.vx=Math.abs(ray.vx)}else if(ray.x>w-1){ray.x=w-1;ray.vx=-Math.abs(ray.vx)}if(ray.y<1){ray.y=1;ray.vy=Math.abs(ray.vy)}else if(ray.y>h-1){ray.y=h-1;ray.vy=-Math.abs(ray.vy)}ray.hue=(ray.hue+2.5*dt)%360;rayTrails.push({x1,y1,x2:ray.x,y2:ray.y,hue:ray.hue,life:520});for(const e of [...enemies])for(const ch of e.chars){ch.beamCooldown=Math.max(0,ch.beamCooldown-dt);if(ch.beamCooldown>0||ch.hp<=0)continue;const q=ch.el.getBoundingClientRect(),left=q.left-r.left,right=q.right-r.left,top=q.top-r.top,bottom=q.bottom-r.top,steps=Math.max(1,Math.ceil(Math.hypot(ray.x-x1,ray.y-y1)/2));let struck=false;for(let k=0;k<=steps;k++){const t=k/steps,px=x1+(ray.x-x1)*t,py=y1+(ray.y-y1)*t;if(px>=left&&px<=right&&py>=top&&py<=bottom){hitGlyph(e,ch,px,py);ch.beamCooldown=8;struck=true;break}}if(struck)break}}}
for(const item of [...items]){item.x+=item.vx*dt;item.y+=item.vy*dt;if(item.x<17){item.x=17;item.vx=Math.abs(item.vx)}else if(item.x>w-17){item.x=w-17;item.vx=-Math.abs(item.vx)}if(item.y<17){item.y=17;item.vy=Math.abs(item.vy)}else if(item.y>h-17){item.y=h-17;item.vy=-Math.abs(item.vy)}item.el.style.left=(item.x-17)+'px';item.el.style.top=(item.y-17)+'px';if(Math.abs(item.x-shipX*w)<24&&Math.abs(item.y-shipY)<26){collectedItems.push(item);renderInventory();item.el.remove();items=items.filter(v=>v!==item);queueBoss();el('status').textContent=item.isUp?'POWER UP':'呪';fireClock=0}}
ctx.clearRect(0,0,w,h);if(beamMode){const grad=ctx.createLinearGradient(shipX*w,shipY,target?target.x:shipX*w,target?target.y:0);for(const [at,color] of [[0,'#ff426f'],[.2,'#ffbd45'],[.4,'#8df45f'],[.6,'#48efff'],[.8,'#6c78ff'],[1,'#ed72ff']])grad.addColorStop(at,color);ctx.strokeStyle=grad;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(shipX*w,shipY);ctx.lineTo(target?target.x:shipX*w,target?target.y:0);ctx.stroke()}for(const seg of rayTrails){const alpha=Math.min(1,seg.life/150);ctx.strokeStyle=`hsla(${seg.hue},100%,62%,${alpha})`;ctx.lineWidth=3;ctx.shadowColor=`hsla(${seg.hue},100%,62%,${alpha})`;ctx.shadowBlur=9;ctx.beginPath();ctx.moveTo(seg.x1,seg.y1);ctx.lineTo(seg.x2,seg.y2);ctx.stroke()}ctx.shadowBlur=0;rayTrails.forEach(seg=>seg.life-=dt);rayTrails=rayTrails.filter(seg=>seg.life>0);for(const s of splats){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;ctx.fillStyle=`hsla(${s.hue},90%,48%,${Math.max(0,s.life/26)})`;ctx.fillRect(Math.round(s.x),Math.round(s.y),s.size,s.size)}splats=splats.filter(s=>s.life>0);for(const b of bullets){ctx.fillStyle=`hsl(${b.hue} 100% 67%)`;ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1)}ship.style.left=(shipX*100)+'%';updateHud();if(!enemies.length&&!pendingMessages.length&&!items.length){clearStage();return}raf=requestAnimationFrame(tick)}
function clearStage(){state='clear';total+=30000;el('status').textContent='送信済み';updateHud();const lastStage=idx===months.length-1;showOverlay(lastStage?'全ステージクリア！':'養育費 ¥30,000 GET！',lastStage?`21か月分、合計 <span class="award">${fmt(total)}</span> を取り戻した。すべての言い訳を撃破！`:`${months[idx]}の脅迫ボスを耐え抜いた。<br><span class="award">養育費 ${fmt(30000)} を獲得！</span><br>累計 ${fmt(total)}`,lastStage?'最初から遊ぶ':'次の月へ');mainBtn.textContent='クリア';}
function move(clientX){const r=arena.getBoundingClientRect();shipX=Math.max(.04,Math.min(.96,(clientX-r.left)/r.width))}
arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture(e.pointerId)});arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')shipX=Math.max(.04,shipX-.035);if(e.key==='ArrowRight'||e.key==='d')shipX=Math.min(.96,shipX+.035);if(e.key===' '&&state==='play')pause()});
function pause(){if(state==='play'){state='pause';cancelAnimationFrame(raf);showOverlay('一時停止','指で左右に動いて、メッセージを狙おう。','再開');mainBtn.textContent='再開'}else if(state==='pause')startStage()}
el('start').addEventListener('click',()=>{if(state==='title'){state='ready';startStage()}else if(state==='clear'){if(idx<months.length-1)idx++;else{idx=0;total=0}startStage()}else if(state==='over')startStage();else if(state==='pause')startStage()});
mainBtn.addEventListener('click',()=>{if(state==='play')pause();else if(state==='clear'){if(idx<months.length-1){idx++;startStage()}else{idx=0;total=0;showOverlay('言い訳を、撃ち落とせ。','届き続けるメッセージを、虹色レーザーですべて破壊しよう。指で自機を動かして、養育費3万円を取り戻せ。','ゲームを始める');state='title'}}else startStage()});
el('prev').addEventListener('click',()=>{if(state==='play')return;idx=Math.max(0,idx-1);updateHud()});el('next').addEventListener('click',()=>{if(state==='play')return;idx=Math.min(months.length-1,idx+1);updateHud()});
updateHud();
