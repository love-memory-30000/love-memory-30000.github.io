function drawShards(dt){for(const p of shards){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size)}ctx.globalAlpha=1;shards=shards.filter(p=>p.life>0)}
function layoutCrisisTokens(){const w=arena.clientWidth,h=arena.clientHeight,top=76,bottom=Math.max(top+144,h-126),cellW=(w-24)/3,cellH=(bottom-top)/3;for(const token of qteTokens){const slot=qteSlots[upLetters.indexOf(token.char)];token.x=12+cellW*(slot%3+.5);token.y=top+cellH*(Math.floor(slot/3)+.5);token.el.style.left=(token.x-22)+'px';token.el.style.top=(token.y-23)+'px'}}
function makeRainbowGlyph(char){const bitmap=makeGlyph(char,1).bitmap,g=bitmap.getContext('2d'),gradient=g.createLinearGradient(0,0,20,20);['#ff6592','#ffe264','#80ffad','#68e9ff','#b48aff','#ff78df'].forEach((color,i)=>gradient.addColorStop(i/5,color));g.globalCompositeOperation='source-in';g.fillStyle=gradient;g.fillRect(0,0,20,20);g.globalCompositeOperation='source-over';return bitmap}
function syncCrisisTokens(){if(!rivalCraft)return;for(const item of collectedItems.filter(i=>i.isUp)){if(qteTokens.some(t=>t.char===item.char))continue;const node=document.createElement('button');node.type='button';node.className='qte-token';node.setAttribute('aria-label',`文字 ${item.char}`);node.appendChild(makeRainbowGlyph(item.char));const token={char:item.char,el:node,recovered:false,x:0,y:0};node.addEventListener('pointerdown',event=>{event.stopPropagation();registerManualInput()});node.addEventListener('click',event=>{event.stopPropagation();handleQteToken(token,true)});node.addEventListener('keydown',event=>event.stopPropagation());arena.appendChild(node);qteTokens.push(token)}layoutCrisisTokens();for(const slot of el('inventoryItems').children)slot.classList.toggle('deployed',qteTokens.some(t=>t.char===slot.dataset.char&&!t.recovered));updateCrisisPrompt()}
function updateCrisisPrompt(){if(!rivalCraft)return;const boss=enemies.find(e=>e.boss),expected=upLetters[qteIndex],available=qteTokens.some(t=>t.char===expected&&!t.recovered),prompt=el('qtePrompt');prompt.classList.remove('hidden');const time=boss?.crisisReady?`残り ${Math.max(0,boss.crisisLimit-boss.crisisTime).toFixed(1)}秒　`:'7文字を揃えよう　';const copy=time+`${qteIndex}/7　次は「${expected}」`+(available?'を押せ！':'の？を集めよう');if(prompt.textContent!==copy)prompt.textContent=copy;for(const t of qteTokens)t.el.classList.toggle('expected',t.char===expected&&!t.recovered);const meter=el('clashMeter');meter.classList.toggle('hidden',!boss?.crisisReady);if(boss?.crisisReady){const remaining=Math.max(0,boss.crisisLimit-boss.crisisTime);meter.setAttribute('aria-valuemax',boss.crisisLimit);meter.setAttribute('aria-valuenow',remaining.toFixed(1));el('clashFill').style.width=(remaining/boss.crisisLimit*100)+'%'}}

function updateCrisis(dt){if(!rivalCraft||state!=='play')return;const boss=enemies.find(e=>e.boss);if(!boss)return;const allOwned=upLetters.every(ch=>collectedItems.some(it=>it.isUp&&it.char===ch));if(!boss.crisisReady&&allOwned){boss.crisisReady=true;boss.crisisTime=0;boss.clashStartY=boss.clashY;boss.clashTargetY=arena.clientHeight-96}if(boss.crisisReady)boss.crisisTime+=dt/60;qteAutoClock+=dt;if(autoPlay&&qteAutoClock>=33){const token=qteTokens.find(t=>t.char===upLetters[qteIndex]&&!t.recovered);if(token){qteAutoClock=0;handleQteToken(token)}}if(state!=='play')return;updateCrisisPrompt();if(boss.crisisReady&&boss.crisisTime>=boss.crisisLimit)beginExplosion(shipX*arena.clientWidth,arena.clientHeight-94)}

let rainbowEndY=0;
for(const e of enemies){const baseSpeed=.36+idx*.014,damageRatio=e.boss?Math.min(1,e.damage/e.maxDamage):0;for(const ch of e.chars)ch.beamCooldown=Math.max(0,ch.beamCooldown-dt);e.frameCooldown=Math.max(0,e.frameCooldown-dt);if(e.boss&&!e.crisisStarted&&(e.liveChars===0&&e.frameHp<=0))beginBossCrisis(e,r,w,h);if(e.crisisStarted)e.pressureClock+=dt;if(e.boss&&e.crisisStarted){if(e.crisisReady){e.clashRecoil=Math.max(0,e.clashRecoil-dt*.8);const t=Math.min(1,e.crisisTime/e.crisisLimit);e.clashY=e.clashStartY+(e.clashTargetY-e.clashStartY)*t-e.clashRecoil}}else e.y+=(e.boss?e.speed*(1-damageRatio):baseSpeed)*dt;e.el.style.top=e.y+'px';if(e.boss){if((e.liveChars===0&&e.frameHp<=0)&&e.y<=0&&!e.crisisStarted){beginBossCrisis(e,r,w,h)}const er=enemyRect(e),sr=ship.getBoundingClientRect();if(!e.crisisStarted&&er.left<sr.right&&er.right>sr.left&&er.top<sr.bottom&&er.bottom>sr.top){beginExplosion(shipX*w,shipY);raf=requestAnimationFrame(tick);return}}else if(e.y>playH-22){state='over';showOverlay('メッセージに押し切られた…',months[idx]+'の言い訳が届いてしまった。もう一度、全部撃ち落とそう。','リトライ');el('status').textContent='未読';updateHud();return}}
if(beamMode){target=homingTarget(r);if(target&&!target.e.boss&&target.e.frameHp>0){const q=enemyRect(target.e),bottom=q.bottom-r.top;beamBlock={x:target.x,y:bottom};if(target.e.frameCooldown<=0){hitFrame(target.e,target.x,bottom);target.e.frameCooldown=7}target=null}else if(target&&target.ch.beamCooldown<=0){hitGlyph(target.e,target.ch,target.x,target.y);target.ch.beamCooldown=4}else if(!target){const e=enemies.find(v=>!v.boss&&v.liveChars===0&&v.frameHp>0);if(e){const q=enemyRect(e);beamBlock={x:shipX*w,y:q.bottom-r.top};if(e.frameCooldown<=0){hitFrame(e,beamBlock.x,beamBlock.y);e.frameCooldown=7}}}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i],previousY=b.y;b.y-=b.vy*dt;let hit=false;for(const e of [...enemies]){if(e.unbreakable&&!e.boss)continue;const rect=enemyRect(e),x=rect.left-r.left,y=rect.top-r.top;if(b.x<x||b.x>x+rect.width)continue;if(e.boss&&!e.crisisStarted&&e.frameHp>0&&previousY>=y+rect.height&&b.y<=y+rect.height){hitFrame(e,b.x,y+rect.height);hit=true;break}if(e.boss){if(e.crisisStarted){if(previousY>=e.clashY&&b.y<=e.clashY){hit=true;break}continue}const ch=bossRayTarget(e,r,b.x);if(!ch)continue;const surface=glyphRect(e,ch).bottom-r.top;if(previousY>=surface&&b.y<=surface){hitGlyph(e,ch,b.x,surface);hit=true;break}continue}if(previousY<y||b.y>y+rect.height)continue;if(!e.boss&&e.frameHp>0&&previousY>=y+rect.height&&b.y<=y+rect.height){hitFrame(e,b.x,y+rect.height);hit=true;break}for(const ch of e.chars){if(ch.hp<=0)continue;const cr=glyphRect(e,ch);if(b.x<cr.left-r.left||b.x>cr.right-r.left||previousY<cr.top-r.top||b.y>cr.bottom-r.top)continue;hitGlyph(e,ch,b.x,b.y);hit=true;break}if(hit)break}if(hit||b.y<0)bullets.splice(i,1)}
if(laserMode&&!rivalCraft)rainbowEndY=updateRainbowRay(r,shipX*w,shipY,dt,powerLevel);
if(beamMode){for(const e of enemies){if(e.frameHp<=0||e.frameCooldown>0)continue;const q=enemyRect(e),left=q.left-r.left,right=q.right-r.left,top=q.top-r.top,bottom=q.bottom-r.top,x=shipX*w;if(((x>=left&&x<=left+4)||(x>=right-4&&x<=right))&&shipY>=top&&shipY<=bottom)hitFrame(e,x,bottom)}}
for(const item of [...items]){item.x+=item.vx*dt;item.y+=item.vy*dt;if(item.x<17){item.x=17;item.vx=Math.abs(item.vx)}else if(item.x>w-17){item.x=w-17;item.vx=-Math.abs(item.vx)}if(item.y<17){item.y=17;item.vy=Math.abs(item.vy)}else if(item.y>h-17){item.y=h-17;item.vy=-Math.abs(item.vy)}item.el.style.left=(item.x-17)+'px';item.el.style.top=(item.y-17)+'px';if(Math.abs(item.x-shipX*w)<24&&Math.abs(item.y-shipY)<26){playSfx('item');autoTargetHoldUntil=performance.now()+550;targetShipX=shipX;collectedItems.push(item);renderInventory();item.el.remove();items=items.filter(v=>v!==item);queueBoss();el('status').textContent=item.isUp?'POWER UP':'呪';fireClock=0}}
ctx.clearRect(0,0,w,h);if(rivalCraft){const boss=enemies.find(e=>e.boss);if(boss)drawBloodClash(boss,w,shipY)}if(beamMode){let endX=beamBlock?beamBlock.x:(target?target.x:shipX*w),endY=beamBlock?beamBlock.y:(target?target.y:0);if(target&&target.e.boss){const br=enemyRect(target.e),edge=br.bottom-r.top,t=(edge-shipY)/(endY-shipY);if(t>=0&&t<=1){endX=shipX*w+(endX-shipX*w)*t;endY=edge}}const grad=ctx.createLinearGradient(shipX*w,shipY,endX,endY);for(const [at,color] of [[0,'#ff426f'],[.2,'#ffbd45'],[.4,'#8df45f'],[.6,'#48efff'],[.8,'#6c78ff'],[1,'#ed72ff']])grad.addColorStop(at,color);ctx.strokeStyle=grad;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(shipX*w,shipY);ctx.lineTo(endX,endY);ctx.stroke()}if(laserMode&&!rivalCraft){drawRainbowBeam(shipX*w,shipY,rainbowEndY,visualClock*.35);for(const trace of laserAfterimages){drawRainbowBeam(trace.x,trace.y2,trace.y1,trace.hue,.07*trace.life/12);trace.life-=dt}laserAfterimages=laserAfterimages.filter(t=>t.life>0)}for(const s of splats){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;ctx.fillStyle='hsla('+s.hue+',90%,48%,'+Math.max(0,s.life/26)+')';ctx.fillRect(Math.round(s.x),Math.round(s.y),s.size,s.size)}splats=splats.filter(s=>s.life>0);for(const p of shards){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size)}for(const p of arcadeSparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/36);ctx.fillStyle='hsl('+p.hue+' 100% 66%)';ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size+1,p.size+1)}ctx.globalAlpha=1;shards=shards.filter(p=>p.life>0);arcadeSparks=arcadeSparks.filter(p=>p.life>0);for(const b of bullets){ctx.fillStyle='hsl('+b.hue+' 100% 67%)';ctx.fillRect(Math.round(b.x),Math.round(b.y),1,laserMode?4:1)}ship.style.left=(shipX*100)+'%';if(frame%8===0)updateHud();if(!enemies.length&&!pendingMessages.length&&!items.length){clearStage();return}raf=requestAnimationFrame(tick)}
function clearStage(){if(state==='clear'||state==='transition')return;if(qteVictoryTimer){clearTimeout(qteVictoryTimer);qteVictoryTimer=null}if(state!=='qteVictory')playSfx('clear');clearCrisis();cancelAnimationFrame(raf);total+=30000;const lastStage=idx===months.length-1;state=lastStage?'clear':'transition';updateHud();if(lastStage){el('status').textContent='送信済み';showOverlay('全ステージクリア！',`21か月分、合計 <span class="award">${fmt(total)}</span> を取り戻した。`,'最初から遊ぶ');mainBtn.textContent='クリア';return}el('status').textContent=months[idx+1]+'へ';showArcadeCue('¥30,000 GET');mainBtn.textContent='次の月へ';last=performance.now();raf=requestAnimationFrame(tick);stageAdvanceTimer=setTimeout(()=>{stageAdvanceTimer=null;if(state!=='transition')return;idx++;startStage()},650)}
function setAuto(value){autoPlay=value;const button=el('autoBtn');button.setAttribute('aria-pressed',String(value));button.textContent=value?'AUTO ON':'AUTO OFF'}
function updateAutoTarget(r,w,shipY){if(!autoPlay||performance.now()<autoTargetHoldUntil)return;if(rivalCraft&&!items.length){targetShipX=.5;return}let tx=null;if(items.length){let best=Infinity;for(const item of items){const d=Math.abs(item.x-shipX*w)+Math.abs(item.y-shipY)*.45;if(d<best){best=d;tx=item.x}}}else{let best=Infinity;for(const e of enemies){if(e.liveChars===0&&e.frameHp>0){const q=enemyRect(e);tx=q.left-r.left+2;best=0;break}for(const ch of e.chars){if(ch.hp<=0)continue;const q=glyphRect(e,ch),x=(q.left+q.right)/2-r.left,y=(q.top+q.bottom)/2-r.top,d=Math.abs(x-shipX*w)+Math.max(0,shipY-y)*.12;if(d<best){best=d;tx=x}}}}if(tx!==null)targetShipX=Math.max(.04,Math.min(.96,tx/w))}
function registerManualInput(){if(state!=='play'||!autoPreferred)return;setAuto(false);clearTimeout(autoReturnTimer);autoReturnTimer=setTimeout(()=>{if(autoPreferred)setAuto(true)},1400)}
function move(clientX){registerManualInput();const r=arena.getBoundingClientRect();targetShipX=Math.max(.04,Math.min(.96,(clientX-r.left)/r.width))}
arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture(e.pointerId)});arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){registerManualInput();targetShipX=Math.max(.04,targetShipX-.035)}if(e.key==='ArrowRight'||e.key==='d'){registerManualInput();targetShipX=Math.min(.96,targetShipX+.035)}if(e.key===' '&&state==='play')pause()});
function pause(){if(state==='play'){playSfx('pause');clearSoundTimers();state='pause';cancelAnimationFrame(raf);showOverlay('一時停止','現在の進行から再開できます。','再開');mainBtn.textContent='再開';updateHud()}else if(state==='pause')resumeGame()}
function resumeGame(){if(state!=='pause')return;ensureAudio();veil.classList.add('hidden');state='play';last=performance.now();mainBtn.textContent='一時停止';updateHud();raf=requestAnimationFrame(tick)}
el('start').addEventListener('click',()=>{if(state==='title'){state='ready';startStage()}else if(state==='clear'){if(idx<months.length-1)idx++;else{idx=0;total=0}startStage()}else if(state==='over')startStage();else if(state==='pause')resumeGame()});
mainBtn.addEventListener('click',()=>{if(state==='qteVictory'||state==='exploding'||state==='transition'||state==='bossEntrance')return;if(state==='pause'){resumeGame();return}if(state==='play')pause();else if(state==='clear'){if(idx<months.length-1){idx++;startStage()}else{idx=0;total=0;showOverlay('言い訳を、撃ち落とせ。','届き続けるメッセージを、虹色レーザーですべて破壊しよう。指で自機を動かして、養育費3万円を取り戻せ。','ゲームを始める');state='title'}}else startStage()});
el('prev').addEventListener('click',()=>{if(['play','pause','qteVictory','exploding','transition','bossEntrance'].includes(state))return;idx=Math.max(0,idx-1);updateHud()});el('next').addEventListener('click',()=>{if(['play','pause','qteVictory','exploding','transition','bossEntrance'].includes(state))return;idx=Math.min(months.length-1,idx+1);updateHud()});
