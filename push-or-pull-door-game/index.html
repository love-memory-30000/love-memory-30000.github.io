<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080c"><title>DOOR PANIC! — 押すか、引くか</title><meta name="description" content="迫るドアを見抜き、押すか引くかを一瞬で判断するPhaser.jsアクションゲーム。"><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305080c'/%3E%3Cpath d='M17 8h31v48H17z' fill='%23ffcf33' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='40' cy='33' r='3'/%3E%3Cpath d='M5 32h19m-7-8 8 8-8 8' fill='none' stroke='%23ff4057' stroke-width='5'/%3E%3C/svg%3E"><style>
:root{--yellow:#ffcf33;--red:#ff4057;--cyan:#24e2e8;--ink:#f5f7f8;--muted:#8999a5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05080c;color:var(--ink);font-family:Impact,"Arial Black","Noto Sans JP",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% 20%,#1b2934 0,#05080c 65%);overflow:hidden}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1050px;margin:auto;padding:12px clamp(10px,2.5vw,24px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #26333d;padding:4px 2px 10px}.brand{font-size:clamp(1.2rem,4vw,2rem);letter-spacing:.04em;transform:skew(-5deg)}.brand b{color:var(--yellow);text-shadow:3px 3px 0 var(--red)}.hint{font:700 .82rem/1.2 ui-sans-serif,"Noto Sans JP",sans-serif;color:var(--muted)}main{display:grid;place-items:center;min-height:0;padding:10px 0}.game-frame{position:relative;width:min(100%,850px);height:100%;max-height:760px;aspect-ratio:4/3;border:2px solid #364855;border-radius:14px;overflow:hidden;background:#05080c;box-shadow:0 26px 90px #000d,0 0 0 5px #fff1}#game,#game canvas{width:100%!important;height:100%!important;display:block!important}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#05080c;color:var(--yellow);z-index:2;letter-spacing:.15em}.ready .loading{display:none}footer{text-align:center;font:700 .78rem/1.2 ui-sans-serif,"Noto Sans JP",sans-serif;color:#63737e;padding:7px}@media(max-width:620px){.shell{padding:8px}.game-frame{aspect-ratio:3/4}.hint{display:none}footer{font-size:.7rem}}@media(max-height:630px) and (min-width:621px){footer{display:none}}
</style></head><body><div class="shell"><header><div class="brand"><b>DOOR PANIC!</b></div><div class="hint">← / A：押す　　→ / D：引く</div></header><main><section class="game-frame" aria-label="押し戸・引き戸 アクションゲーム"><div class="loading">LOADING...</div><div id="game"></div></section></main><footer>判断が遅いと、顔面からいきます。</footer></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
(()=>{
const C={bg:0x05080c,y:0xffcf33,r:0xff4057,c:0x24e2e8,w:0xf5f7f8,m:0x8999a5,g:0x67f29d};
const cases=[
 {where:'コンビニ',sign:'押',kind:'plate',ans:'push',why:'平らな押し板。押して開ける。'},
 {where:'古い喫茶店',sign:'',kind:'handle',ans:'pull',why:'手前の縦取っ手は、引くためのもの。'},
 {where:'非常口',sign:'',kind:'panic',ans:'push',why:'横棒に体重をかけて押し開ける。'},
 {where:'雑居ビル',sign:'PULL',kind:'knob',ans:'pull',why:'文字どおりPULL。焦ると読めない。'},
 {where:'駅の通路',sign:'PUSH',kind:'bar',ans:'push',why:'PUSHの表示が正解。'},
 {where:'雨の書店',sign:'',kind:'hinge',ans:'pull',why:'蝶番がこちら側。こちらへ開く。'},
 {where:'地下倉庫',sign:'引',kind:'handle',ans:'pull',why:'「引」と取っ手、二つの手がかり。'},
 {where:'病院の廊下',sign:'押',kind:'plate',ans:'push',why:'押し板と「押」の表示。'}
];
class Synth{constructor(){this.ctx=null;this.muted=false}start(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.ctx.resume();this.tone(180,.05,'square',.03)}tone(f,d=.08,type='square',v=.05,slide=0){if(this.muted||!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+d)}click(){this.tone(260,.045,'square',.035,90)}tick(n){this.tone(n%2?90:110,.035,'triangle',.018)}ok(combo){this.tone(440+combo*35,.09,'square',.05,260);setTimeout(()=>this.tone(690+combo*25,.12,'sine',.04,180),65)}bad(){this.tone(120,.28,'sawtooth',.09,-75);setTimeout(()=>this.tone(55,.18,'square',.07),90)}toggle(){this.muted=!this.muted;if(!this.muted)this.click();return this.muted}}
const audio=new Synth();
class Game extends Phaser.Scene{
 constructor(){super('game');this.score=0;this.combo=0;this.lives=3;this.round=0;this.lock=true;this.running=false}
 create(){document.querySelector('.game-frame').classList.add('ready');this.keys=this.input.keyboard.addKeys('LEFT,RIGHT,A,D,SPACE');this.keys.LEFT.on('down',()=>this.choose('push'));this.keys.A.on('down',()=>this.choose('push'));this.keys.RIGHT.on('down',()=>this.choose('pull'));this.keys.D.on('down',()=>this.choose('pull'));this.keys.SPACE.on('down',()=>{if(!this.running)this.startRun()});this.cameras.main.setBackgroundColor(C.bg);this.showTitle()}
 text(x,y,s,z=24,color='#f5f7f8'){return this.add.text(x,y,s,{fontFamily:'Impact,"Arial Black","Noto Sans JP",sans-serif',fontSize:z+'px',color,align:'center',stroke:'#05080c',strokeThickness:Math.max(2,z*.08),lineSpacing:5}).setOrigin(.5)}
 reset(){this.children.removeAll();this.tweens.killAll();this.time.removeAllEvents();const w=this.scale.width,h=this.scale.height;this.add.rectangle(w/2,h/2,w,h,C.bg);for(let i=0;i<14;i++)this.add.line(w/2,h*.54,0,0,(i-7)*w*.16,h*.46,0x29404c,.32).setOrigin(0);for(let y=h*.54;y<h;y+=h*.075)this.add.line(0,y,0,0,w,0,0x29404c,.28).setOrigin(0)}
 showTitle(){this.reset();this.running=false;this.lock=true;const w=this.scale.width,h=this.scale.height;this.text(w/2,h*.18,'押すか、引くか。',Math.max(24,w*.045));this.text(w/2,h*.29,'迷えば激突。',Math.max(42,w*.08),'#ffcf33').setAngle(-3);this.text(w/2,h*.43,'迫ってくるドアの手がかりを読め。\n3回ぶつかったら終了。',Math.max(16,w*.026),'#aebbc3');this.bigButton(w/2,h*.62,'走り出す',()=>this.startRun(),C.r);this.soundButton();this.text(w/2,h*.78,'← 押す　／　引く →',Math.max(16,w*.025),'#24e2e8')}
 startRun(){audio.start();this.score=0;this.combo=0;this.lives=3;this.round=0;this.running=true;this.next()}
 hud(){const w=this.scale.width;this.text(24,25,`SCORE ${this.score}`,17,'#ffcf33').setOrigin(0,.5);this.text(w/2,25,`×${Math.max(1,this.combo)}`,22,this.combo>=3?'#ff4057':'#f5f7f8');this.text(w-24,25,'♥'.repeat(this.lives)+'♡'.repeat(3-this.lives),21,'#ff4057').setOrigin(1,.5);this.add.line(w/2,52,20,0,w-20,0,0x41535e,.8)}
 next(){this.reset();this.hud();this.lock=false;this.lastTick=-1;const w=this.scale.width,h=this.scale.height;const base=cases[this.round%cases.length],flip=this.round>7&&Math.random()<.32;this.current={...base};if(flip){this.current.sign=this.current.sign==='PUSH'?'PULL':this.current.sign==='PULL'?'PUSH':this.current.sign==='押'?'引':this.current.sign==='引'?'押':this.current.sign;this.current.ans=this.current.sign==='PULL'||this.current.sign==='引'?'pull':this.current.sign==='PUSH'||this.current.sign==='押'?'push':base.ans;this.current.why='表示が変わった。前のドアを覚えていても意味はない。'}this.text(w/2,78,`DOOR ${this.round+1}　${this.current.where}`,Math.max(16,w*.025),'#8999a5');this.makeDoor();this.makeRunner();this.controls();const limit=Math.max(1450,3200-this.round*115);this.timerBar=this.add.rectangle(20,h-126,w-40,8,C.g).setOrigin(0,.5);this.tweens.add({targets:this.timerBar,scaleX:0,duration:limit,ease:'Linear',onUpdate:tw=>{const p=tw.progress;if(p>.58&&Math.floor(p*18)!==this.lastTick){this.lastTick=Math.floor(p*18);audio.tick(this.lastTick)}},onComplete:()=>this.choose('timeout')});this.tweens.add({targets:this.doorGroup,scaleX:1.58,scaleY:1.58,y:h*.54,duration:limit,ease:'Cubic.easeIn'});this.tweens.add({targets:this.runner,x:w*.46,duration:limit,ease:'Cubic.easeIn'})}
 makeDoor(){const w=this.scale.width,h=this.scale.height,dw=Math.min(w*.26,170),dh=dw*1.5,r=this.current,x=w*.61,y=h*.34;this.doorGroup=this.add.container(x,y).setScale(.58);const frame=this.add.rectangle(0,0,dw+18,dh+18,0x23313a).setStrokeStyle(3,0x69808d);const door=this.add.rectangle(0,0,dw,dh,[0x37657a,0x76502f,0x4c7653,0x6e4266][this.round%4]).setStrokeStyle(3,0xc9d4d9,.55);const objs=[frame,door];if(r.sign)objs.push(this.add.rectangle(0,-dh*.22,dw*.62,38,0xf2ebd4).setStrokeStyle(2,0x11181d),this.text(0,-dh*.22,r.sign,19,'#11181d').setStroke('#11181d',0));if(r.kind==='handle'||r.kind==='hinge')objs.push(this.add.rectangle(dw*.32,dh*.14,10,58,0xe0e7e8),this.add.rectangle(dw*.25,dh*.14,25,8,0xaab4b8));else if(r.kind==='panic'||r.kind==='bar')objs.push(this.add.rectangle(0,dh*.15,dw*.78,16,0xe0e7e8),this.add.rectangle(-dw*.32,dh*.15,10,35,0x8a979c),this.add.rectangle(dw*.32,dh*.15,10,35,0x8a979c));else if(r.kind==='plate')objs.push(this.add.rectangle(dw*.3,dh*.14,22,70,0xc9d2d4));else objs.push(this.add.circle(dw*.31,dh*.14,9,0xffd56a));if(r.kind==='hinge')[-dh*.3,dh*.3].forEach(yy=>objs.push(this.add.rectangle(-dw*.47,yy,10,30,0x171d20)));this.doorPanel=door;this.doorGroup.add(objs)}
 makeRunner(){const w=this.scale.width,h=this.scale.height;this.runner=this.add.container(w*.08,h*.61);const head=this.add.circle(0,-30,13,C.y).setStrokeStyle(3,C.bg);const body=this.add.rectangle(0,4,21,45,C.c).setStrokeStyle(3,C.bg);const leg1=this.add.line(0,27,0,0,-15,27,C.w,5),leg2=this.add.line(0,27,0,0,17,22,C.w,5),arm=this.add.line(0,0,-9,0,18,-5,C.w,5);this.runner.add([head,body,leg1,leg2,arm]);this.tweens.add({targets:[leg1,leg2],angle:{from:-22,to:22},yoyo:true,repeat:-1,duration:110})}
 controls(){const w=this.scale.width,h=this.scale.height;this.smallButton(w*.27,h-70,'←  押す',()=>this.choose('push'),C.y,'#05080c');this.smallButton(w*.73,h-70,'引く  →',()=>this.choose('pull'),C.c,'#05080c');this.soundButton()}
 smallButton(x,y,label,fn,bg,fg){const w=this.scale.width,b=this.add.rectangle(x,y,Math.min(250,w*.39),66,bg).setStrokeStyle(2,0xffffff,.25).setInteractive({useHandCursor:true});const t=this.text(x,y,label,Math.max(17,w*.026),fg).setStroke(fg,0);b.on('pointerdown',()=>{audio.click();fn()});b.on('pointerover',()=>this.tweens.add({targets:[b,t],scale:1.04,duration:80}));b.on('pointerout',()=>this.tweens.add({targets:[b,t],scale:1,duration:80}))}
 bigButton(x,y,label,fn,bg){const w=this.scale.width,b=this.add.rectangle(x,y,Math.min(330,w*.68),74,bg).setStrokeStyle(3,0xffffff,.4).setInteractive({useHandCursor:true});const t=this.text(x,y,label,Math.max(21,w*.035));b.on('pointerdown',()=>{audio.start();audio.click();fn()});this.tweens.add({targets:[b,t],scale:1.025,yoyo:true,repeat:-1,duration:520})}
 soundButton(){const w=this.scale.width,b=this.text(w-22,76,audio.muted?'音 OFF':'音 ON',14,audio.muted?'#8999a5':'#67f29d').setOrigin(1,.5).setInteractive({useHandCursor:true});b.on('pointerdown',()=>{audio.start();b.setText(audio.toggle()?'音 OFF':'音 ON');b.setColor(audio.muted?'#8999a5':'#67f29d')})}
 choose(choice){if(this.lock||!this.running)return;this.lock=true;this.tweens.killTweensOf(this.timerBar);this.tweens.killTweensOf(this.doorGroup);this.tweens.killTweensOf(this.runner);const ok=choice===this.current.ans;if(ok){this.combo++;const gain=100+Math.min(this.combo,10)*25;this.score+=gain;audio.ok(this.combo);this.flash('突破！',`+${gain}　COMBO ×${this.combo}`,C.g);this.tweens.add({targets:this.doorPanel,scaleX:.08,x:this.current.ans==='push'?60:-50,alpha:.35,duration:280});this.tweens.add({targets:this.runner,x:this.scale.width*.88,duration:500,ease:'Back.easeIn'})}else{this.combo=0;this.lives--;audio.bad();this.cameras.main.shake(330,.018);this.flash(choice==='timeout'?'判断が遅い！':'激突！',this.current.why,C.r);this.tweens.add({targets:this.runner,angle:-95,x:'-=55',y:'+=25',duration:350,ease:'Back.easeOut'})}this.time.delayedCall(ok?850:1450,()=>{this.round++;if(this.lives<=0)this.gameOver();else this.next()})}
 flash(a,b,color){const w=this.scale.width,h=this.scale.height,p=this.add.rectangle(w/2,h*.46,w*.88,128,0x05080c,.94).setStrokeStyle(3,color);const t=this.text(w/2,h*.42,a,Math.max(34,w*.06),color===C.g?'#67f29d':'#ff4057');const s=this.text(w/2,h*.51,b,Math.max(14,w*.022),'#f5f7f8');s.setWordWrapWidth(w*.75);this.tweens.add({targets:[p,t,s],scale:{from:.82,to:1},duration:170,ease:'Back.easeOut'})}
 gameOver(){this.reset();this.running=false;const w=this.scale.width,h=this.scale.height,best=Number(localStorage.getItem('doorPanicBest')||0),isBest=this.score>best;if(isBest)localStorage.setItem('doorPanicBest',this.score);this.text(w/2,h*.2,'GAME OVER',Math.max(45,w*.085),'#ff4057').setAngle(-3);this.text(w/2,h*.37,`${this.score} 点`,Math.max(38,w*.067),'#ffcf33');this.text(w/2,h*.48,`突破したドア：${this.round}枚\n最高記録：${Math.max(best,this.score)}点${isBest?'　NEW!':''}`,Math.max(16,w*.025),'#aebbc3');this.bigButton(w/2,h*.66,'もう一度走る',()=>this.startRun(),C.c);this.soundButton()}
}
const config={type:Phaser.AUTO,parent:'game',backgroundColor:'#05080c',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH,width:'100%',height:'100%'},render:{antialias:true},scene:[Game]};
const boot=()=>window.Phaser?new Phaser.Game(config):document.querySelector('.loading').textContent='読み込みに失敗しました。';boot();
})();
</script></body></html>
