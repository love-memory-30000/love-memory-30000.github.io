<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="愛のメモリーにまつわる作品と記録の目次。">
  <title>愛のメモリー｜目次</title>
  <style>
    :root{--ink:#1e302c;--muted:#6d7773;--paper:#f8f4ea;--card:#fffdf7;--line:#c9c0aa;--green:#1e3a34;--gold:#c89535;--red:#a84c3c}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.8}
    .wrap{width:min(900px,calc(100% - 40px));margin:auto}.mast{padding:70px 0 35px;border-bottom:1px solid var(--line)}
    .eyebrow{font:700 .8rem/1.2 ui-monospace,monospace;letter-spacing:.18em;color:var(--red);text-transform:uppercase}
    h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(2.8rem,8vw,5.8rem);line-height:1;margin:.2em 0 .3em;letter-spacing:-.06em}
    .lead{color:var(--muted);max-width:600px;margin:0}
    main{padding:48px 0 80px}.pages{display:grid;gap:16px;margin-top:24px}
    a{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid #ded5c4;padding:24px 26px;transition:transform .2s ease,border-color .2s ease}
    a:hover{transform:translateY(-2px);border-color:var(--gold)}
    .label{font:700 .75rem/1.2 ui-monospace,monospace;color:var(--red);letter-spacing:.12em}
    h2{font-family:"Yu Mincho",serif;font-size:1.5rem;margin:.35em 0 .15em}.desc{color:var(--muted);margin:0}
    footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.9rem}
    @media(max-width:700px){.wrap{width:min(100% - 26px,900px)}.mast{padding-top:42px}}
  </style>
</head>
<body>
  <header class="wrap mast">
    <div class="eyebrow">Love memory</div>
    <h1>愛のメモリー</h1>
    <p class="lead">人生の記録と、そこから生まれた作品への入口。</p>
  </header>
  <main class="wrap">
    <div class="pages">
      <a href="./life-timeline/">
        <div class="label">LIFE TIMELINE</div>
        <h2>愛のメモリー</h2>
        <p class="desc">人生の節目を年代順に振り返る個人年表。</p>
      </a>
      <a href="./yoikuhi-to-ai/">
        <div class="label">SHORT GAME</div>
        <h2>養育費と愛</h2>
        <p class="desc">届かない養育費を毎月ひとつのメッセージで催促する短編ゲーム。</p>
      </a>
      <a href="./push-or-pull-door-game/">
        <div class="label">ACTION GAME</div>
        <h2>DOOR PANIC!</h2>
        <p class="desc">押すか引くかを一瞬で判断するドア判定ゲーム。</p>
      </a>
    </div>
  </main>
  <footer class="wrap">続きは、これから。</footer>
</body>
</html>
