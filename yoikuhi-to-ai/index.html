<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101321">
<meta name="description" content="言い訳メッセージを虹色レーザーで撃ち落とす、月別ステージ制のピクセルシューティングゲーム。">
<title>養育費と愛 — レインボー・メッセージシューター</title>
<style>
:root{color-scheme:dark;--bg:#101321;--panel:#191e31;--line:#343b56;--ink:#f4f4fb;--muted:#a9b0c7;--cyan:#55e6ff;--pink:#ff61ac;--lime:#b8ff69}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100dvh;display:grid;place-items:center;padding:12px}.phone{width:min(100%,430px);height:min(920px,calc(100dvh - 24px));min-height:550px;background:#0b0e18;border:1px solid #404862;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px #0009;position:relative}.top{padding:15px 17px 12px;background:#171b2b;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border:2px solid #737d9d;background:#282e43;display:grid;place-items:center;font-size:20px;image-rendering:pixelated}.name{font-weight:800;font-size:15px}.status{font-size:12px;color:var(--muted);margin-top:3px}.month{margin-left:auto;border:1px solid #555e79;background:#22283a;padding:7px 9px;font-size:12px;white-space:nowrap}.hud{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid #292f45}.hud strong{color:var(--ink);font-size:14px}.arena{position:relative;flex:1;min-height:0;overflow:hidden;background-color:#111525;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:16px 16px;touch-action:none}.arena:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#171d30a0,transparent 75%);pointer-events:none}.feed-label{position:absolute;left:12px;top:10px;color:#717a98;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.messages{position:absolute;inset:34px 12px 62px;pointer-events:none}.bubble{position:absolute;left:0;width:48%;max-width:none;padding:8px 9px;background:#252b41;border:1px solid #4a5474;color:#f7f7ff;font:500 13px/1.35 system-ui,sans-serif;box-shadow:3px 3px 0 #080a11;transition:filter .08s}.bubble:after{content:"";position:absolute;left:8px;bottom:-5px;width:8px;height:5px;background:#252b41;border-bottom:1px solid #4a5474;clip-path:polygon(0 0,100% 0,0 100%)}.bubble small{display:block;margin-top:5px;color:#9da6c2;font:10px ui-monospace,monospace}.bubble.hit{filter:brightness(1.35)}.pixel-chip{position:absolute;width:1px;height:1px;background:#111525;z-index:2;pointer-events:none}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ship{position:absolute;bottom:20px;left:50%;width:12px;height:12px;transform:translateX(-50%);image-rendering:pixelated;filter:drop-shadow(0 0 7px #56e6ff)}.ship i{position:absolute;width:3px;height:3px;background:#fff}.ship i:nth-child(1){left:3px;top:0;background:#ff61ac}.ship i:nth-child(2){left:0;top:3px;background:#59e9ff}.ship i:nth-child(3){left:6px;top:3px;background:#b8ff69}.ship i:nth-child(4){left:3px;top:6px;background:#fff}.bottom{padding:11px 12px calc(11px + env(safe-area-inset-bottom));background:#171b2b;border-top:1px solid var(--line)}.tip{font-size:11px;color:#a9b0c7;text-align:center;margin-bottom:9px}.bar{display:flex;gap:8px}.btn{appearance:none;border:1px solid #58617d;background:#252c41;color:#fff;padding:11px 12px;font:700 12px ui-monospace,monospace;cursor:pointer}.btn:active{transform:translateY(1px)}.btn.primary{background:#cb3d85;border-color:#ff77b9;flex:1}.btn.subtle{min-width:70px}.progress{height:4px;background:#2a3046}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff4fa0,#ffcf4a,#68f58f,#4edaff,#ab72ff);width:0;transition:width .3s}.veil{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#090c16dd;padding:24px;text-align:center}.card{max-width:320px;padding:22px 18px;border:1px solid #535d7c;background:#171c2c;box-shadow:6px 6px 0 #070910}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:.12em}.card h1{font-size:22px;line-height:1.35;margin:11px 0}.card p{font:14px/1.65 system-ui,sans-serif;color:#c2c8dc;margin:10px 0 18px}.card .primary{width:100%;font-size:14px;padding:13px}.award{color:var(--lime);font-weight:800}.hidden{display:none!important}.toast{position:absolute;z-index:3;top:42px;left:50%;transform:translate(-50%,-10px);background:#101522ed;border:1px solid #ff61ac;padding:7px 10px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:650px){.top{padding:9px 13px}.avatar{width:32px;height:32px}.hud{padding:7px 12px}.bubble{padding:7px 9px;font-size:12px}.bottom{padding-top:7px}.tip{margin-bottom:5px}}
</style><style>
.bubble{display:block;padding:7px 8px;width:48%;background:#252b41;border:1px solid #4a5474;box-shadow:3px 3px 0 #080a11}
.bubble-content{display:flex;flex-wrap:wrap;align-content:flex-start;width:100%;min-height:17px}
.glyph{position:relative;display:inline-block;flex:0 0 14px;width:14px;height:17px;image-rendering:pixelated}
.glyph-pixels{display:block;width:14px;height:14px;image-rendering:pixelated}
.glyph-health{position:absolute;left:1px;bottom:0;width:12px;height:2px;background:#101321;overflow:hidden}
.glyph-health i{display:block;height:100%;background:linear-gradient(90deg,#ff61ac,#ffd45b,#62ebff)}
.glyph-space{flex:0 0 7px;width:7px;height:17px}
.pixel-chip{position:absolute;width:1px;height:1px;background:#111525;z-index:3;pointer-events:none}
.bubble small{margin-top:4px;font-size:10px}
</style></head>
<body><main class="phone" aria-label="養育費と愛 レインボー・メッセージシューター">
<header class="top"><div class="avatar" aria-hidden="true">👾</div><div><div class="name">あいて</div><div class="status" id="status">メッセージアプリ</div></div><div class="month" id="month">2016年6月</div></header>
<div class="hud"><span>STAGE <strong id="stage">01</strong> / 21</span><span>のこり <strong id="remaining">0</strong></span><span>獲得 <strong id="money">¥0</strong></span></div><div class="progress"><span id="progress"></span></div>
<section class="arena" id="arena" aria-label="ゲーム画面"><div class="feed-label">INCOMING MESSAGES</div><div class="messages" id="messages"></div><canvas id="fx"></canvas><div class="ship" id="ship" aria-label="自機"><i></i><i></i><i></i><i></i></div><div class="toast" id="toast">撃破！</div></section>
<footer class="bottom"><div class="tip" id="tip">指で自機を左右に移動　・　レーザーは自動連射</div><div class="bar"><button class="btn subtle" id="prev" aria-label="前のステージ">◀</button><button class="btn primary" id="main">ステージ開始</button><button class="btn subtle" id="next" aria-label="次のステージ">▶</button></div></footer>
<div class="veil" id="veil"><div class="card"><div class="eyebrow">RAINBOW MESSAGE SHOOTER</div><h1 id="vtitle">言い訳を、撃ち落とせ。</h1><p id="vtext">届き続けるメッセージを、虹色レーザーですべて破壊しよう。指で自機を動かして、養育費3万円を取り戻せ。</p><button class="btn primary" id="start">ゲームを始める</button></div></div>
</main><script>
(()=>{'use strict';
const months=[];for(let y=2016,m=6; y<2018||(y===2018&&m<=2);){months.push(`${y}年${m}月`);if(++m===13){m=1;y++}}
const excuses=["今月はちょっと厳しい","来月まとめて払うよ","振込先がわからなくなった","仕事が落ち着いたら連絡する","今は手元にお金がない","忘れてた。あとで確認する","口座の残高が足りなかった","その話、また今度にして","今月は出費が重なってる","払う気はあるんだけど","連絡するって言ったよね","今すぐは無理。待って","手続きがまだ終わってない","給料日まで待ってほしい","そんなに急かさないで","今月分は来月に回して","ちょっと事情があって","確認してから返事する","今は忙しくて対応できない","もう少しだけ待ってくれない？","払ったつもりでいた","今月は本当に余裕がない","また連絡するから","そのうち何とかするよ","今は話したくない","振込が反映されてないだけ","いろいろ立て込んでる","あとでちゃんと考える","今月は見送らせて","すぐには約束できない","また同じ話？","来週には何とかする","いま仕事中だから","ちょっと待ってて","今月は無理そう","ちゃんと考えてるよ","すぐ払うとは言ってない","もう少し時間がほしい","今はそれどころじゃない","今月分は難しいと思う","連絡するのを忘れてた","その件はまた改めて","口座を変えたから","今月は出費が多くて","来月なら払えると思う","今はお金が動かせない","確認するって言ったでしょ","すぐ返事できない","今月は待ってほしい","その話は終わったと思ってた","振込の準備ができてない","来月こそちゃんとする","今月はちょっと無理","払う時期は相談したい","今は約束できない","また後で連絡する","予定が変わったんだ","今月は保留にして","必要ならまた話そう","考えておくよ","今は余裕がないんだ","もう少し待ってくれれば","そのうち連絡する","手元に現金がない","今月の分は厳しい","すぐに決められない","話を大きくしないで","連絡が遅れてごめん","また今度にしてほしい"];
const arena=document.querySelector('#arena'),messagesEl=document.querySelector('#messages'),ship=document.querySelector('#ship'),canvas=document.querySelector('#fx'),ctx=canvas.getContext('2d'),veil=document.querySelector('#veil'),mainBtn=document.querySelector('#main');
let idx=0,state='title',enemies=[],bullets=[],last=0,spawnClock=0,shipX=.5,frame=0,total=0,raf=0,toastTimer;
const el=id=>document.getElementById(id),fmt=n=>'¥'+n.toLocaleString('ja-JP');
function resize(){const r=arena.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);canvas.dataset.scale=d;}
new ResizeObserver(resize).observe(arena);resize();
function updateHud(){el('stage').textContent=String(idx+1).padStart(2,'0');el('month').textContent=months[idx];el('remaining').textContent=state==='play'?enemies.length:0;el('money').textContent=fmt(total);el('progress').style.width=((idx+1)/months.length*100)+'%';el('prev').disabled=idx===0;el('next').disabled=idx===months.length-1;el('tip').textContent=`文字HP ${idx+1}　・　指で自機を左右に移動　・　自動連射`}
function makeGlyph(char,hp){const wrap=document.createElement('span');wrap.className='glyph';wrap.title=`${char}　HP ${hp}/${hp}`;wrap.setAttribute('aria-hidden','true');const bitmap=document.createElement('canvas');bitmap.className='glyph-pixels';bitmap.width=8;bitmap.height=8;const g=bitmap.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#f7f7ff';g.font='8px sans-serif';g.textBaseline='top';g.fillText(char,0,0,8);const meter=document.createElement('span');meter.className='glyph-health';const fill=document.createElement('i');fill.style.width='12px';meter.appendChild(fill);wrap.append(bitmap,meter);return{el:wrap,fill,hp,maxHp:hp}}
function showOverlay(title,copy,button='つづける'){el('vtitle').textContent=title;el('vtext').innerHTML=copy;el('start').textContent=button;veil.classList.remove('hidden')}
function startStage(){veil.classList.add('hidden');cancelAnimationFrame(raf);messagesEl.innerHTML='';bullets=[];enemies=[];frame=0;spawnClock=0;state='play';el('status').textContent='既読';mainBtn.textContent='一時停止';const count=6,hpPerGlyph=idx+1;for(let i=0;i<count;i++){const text=excuses[(idx*7+i*9)%excuses.length],e={text,x:(i%2)*52,y:0,el:null,chars:[],liveChars:0};const d=document.createElement('div');d.className='bubble';const content=document.createElement('div');content.className='bubble-content';content.setAttribute('role','img');content.setAttribute('aria-label',text);for(const ch of Array.from(text)){if(/\s/.test(ch)){const space=document.createElement('span');space.className='glyph-space';space.setAttribute('aria-hidden','true');content.appendChild(space);continue}const glyph=makeGlyph(ch,hpPerGlyph);content.appendChild(glyph.el);e.chars.push({char:ch,...glyph})}e.liveChars=e.chars.length;const meta=document.createElement('small');meta.textContent=`${months[idx]}　既読`;d.append(content,meta);messagesEl.appendChild(d);e.el=d;enemies.push(e)}const rows=Math.ceil(count/2);let top=0;for(let row=0;row<rows;row++){const pair=enemies.slice(row*2,row*2+2);pair.forEach(e=>e.y=top);top+=Math.max(...pair.map(e=>e.el.getBoundingClientRect().height))+9}last=performance.now();updateHud();raf=requestAnimationFrame(tick)}
function tick(now){if(state!=='play')return;const dt=Math.min((now-last)/16.67,2);last=now;frame++;const r=arena.getBoundingClientRect(),h=messagesEl.clientHeight;spawnClock+=dt;
// A fresh 1×1 pixel projectile is emitted every rendered frame.
bullets.push({x:shipX*r.width,y:r.height-31,vy:8, hue:(frame*7)%360});
for(const e of enemies){e.y+=(.28+idx*.018)*dt;e.el.style.top=e.y+'px';e.el.style.left=e.x+'%';if(e.y>h-22){state='over';showOverlay('メッセージに押し切られた…',`${months[idx]}の言い訳が届いてしまった。もう一度、全部撃ち落とそう。`,'リトライ');el('status').textContent='未読';updateHud();return}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.vy*dt;let hit=false;for(const e of enemies){const rect=e.el.getBoundingClientRect(),ar=arena.getBoundingClientRect(),x=rect.left-ar.left,y=rect.top-ar.top;if(b.x<x||b.x>x+rect.width||b.y<y||b.y>y+rect.height)continue;for(const ch of e.chars){if(ch.hp<=0)continue;const cr=ch.el.getBoundingClientRect();if(b.x<cr.left-ar.left||b.x>cr.right-ar.left||b.y<cr.top-ar.top||b.y>cr.bottom-ar.top)continue;ch.hp--;hit=true;ch.el.title=`${ch.char}　HP ${ch.hp}/${ch.maxHp}`;ch.fill.style.width=ch.hp?`${Math.max(1,Math.ceil(ch.hp/ch.maxHp*12))}px`:'0';const chip=document.createElement('i');chip.className='pixel-chip';chip.style.left=Math.floor(Math.random()*14)+'px';chip.style.top=Math.floor(Math.random()*14)+'px';ch.el.appendChild(chip);if(ch.hp<=0){ch.el.remove();e.liveChars--;if(e.liveChars===0){e.el.remove();enemies=enemies.filter(q=>q!==e);flashToast()}}else{e.el.classList.add('hit');setTimeout(()=>e.el&&e.el.classList.remove('hit'),80)}break}if(hit)break}if(hit||b.y<0)bullets.splice(i,1)}
ctx.clearRect(0,0,r.width,r.height);for(const b of bullets){ctx.fillStyle=`hsl(${b.hue} 100% 67%)`;ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1)}ship.style.left=(shipX*100)+'%';updateHud();if(!enemies.length){clearStage();return}raf=requestAnimationFrame(tick)}
function flashToast(){const t=el('toast');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),180)}
function clearStage(){state='clear';total+=30000;el('status').textContent='送信済み';updateHud();const lastStage=idx===months.length-1;showOverlay(lastStage?'全ステージクリア！':'養育費 ¥30,000 GET！',lastStage?`21か月分、合計 <span class="award">${fmt(total)}</span> を取り戻した。すべての言い訳を撃破！`:`${months[idx]}の言い訳をすべて撃破。<br><span class="award">養育費 ${fmt(30000)} を獲得！</span><br>累計 ${fmt(total)}`,lastStage?'最初から遊ぶ':'次の月へ');mainBtn.textContent='クリア';}
function move(clientX){const r=arena.getBoundingClientRect();shipX=Math.max(.04,Math.min(.96,(clientX-r.left)/r.width))}
arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture(e.pointerId)});arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')shipX=Math.max(.04,shipX-.035);if(e.key==='ArrowRight'||e.key==='d')shipX=Math.min(.96,shipX+.035);if(e.key===' '&&state==='play')pause()});
function pause(){if(state==='play'){state='pause';cancelAnimationFrame(raf);showOverlay('一時停止','指で左右に動いて、メッセージを狙おう。','再開');mainBtn.textContent='再開'}else if(state==='pause')startStage()}
el('start').addEventListener('click',()=>{if(state==='title'){state='ready';startStage()}else if(state==='clear'){if(idx<months.length-1)idx++;else{idx=0;total=0}startStage()}else if(state==='over')startStage();else if(state==='pause')startStage()});
mainBtn.addEventListener('click',()=>{if(state==='play')pause();else if(state==='clear'){if(idx<months.length-1){idx++;startStage()}else{idx=0;total=0;showOverlay('言い訳を、撃ち落とせ。','届き続けるメッセージを、虹色レーザーですべて破壊しよう。指で自機を動かして、養育費3万円を取り戻せ。','ゲームを始める');state='title'}}else startStage()});
el('prev').addEventListener('click',()=>{if(state==='play')return;idx=Math.max(0,idx-1);updateHud()});el('next').addEventListener('click',()=>{if(state==='play')return;idx=Math.min(months.length-1,idx+1);updateHud()});
updateHud();
})();
</script></body></html>
