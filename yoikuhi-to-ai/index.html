<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="届かない養育費を、毎月ひとつのメッセージで催促する短編ゲーム。" />
  <title>養育費と愛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2838'/%3E%3Cpath d='M13 18h38v29H13z' fill='%23f0eadb'/%3E%3Cpath d='M18 26h28M18 33h28M18 40h17' stroke='%239b3f3f' stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #111923; color: #f4f0e8; }
    main { width: min(100%, 430px); margin: 0 auto; padding: 14px 10px 24px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 14px; }
    h1 { margin: 0; font-family: serif; font-size: clamp(1.8rem, 8vw, 2.35rem); font-weight: 500; letter-spacing: .08em; }
    .years { margin: 0 0 .25rem; color: #9da8b3; font: .78rem/1.2 ui-monospace, monospace; letter-spacing: .12em; }
    .frame { padding: 7px; border: 1px solid #405064; background: #0b1119; box-shadow: 0 24px 70px #0008; }
    #game { overflow: hidden; width: 100%; aspect-ratio: 39 / 70; background: #e9e2d2; touch-action: manipulation; }
    #game canvas { display: block; width: 100% !important; height: 100% !important; }
    .hint { min-height: 1.4em; margin: .8rem .2rem 0; color: #b4bdc6; font-size: 1rem; line-height: 1.55; }
    @media (max-width: 430px) { main { padding: 10px 8px 22px; } header { margin: 4px 4px 10px; } .years { display: none; } }
  </style>
</head>
<body>
  <main>
    <header><h1>養育費と愛</h1><p class="years">2016.06 — 2018.02</p></header>
    <div class="frame"><div id="game" aria-label="養育費と愛 ゲーム画面"></div></div>
    <p class="hint" id="hint">通帳の明細から、次の月を選んでください。</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    const WIDTH = 390, HEIGHT = 700;
    const months = [];
    for (let year = 2016, month = 6; year < 2018 || (year === 2018 && month <= 2); month++) {
      if (month === 13) { year++; month = 1; }
      months.push({ year, month, label: `${year}年${month}月` });
    }
    const excuses = [
      '今月ちょっと厳しい。来月まとめて払う。', '仕事が減って、まだ振り込めてない。',
      '給料日がずれた。もう少し待って。', '急な出費があった。来週には何とかする。',
      '口座を確認してなかった。あとで見る。', '今は余裕がない。払えるときに払う。',
      '年末で出費が多い。来月にしてほしい。', '忘れてた。近いうちに振り込む。',
      '体調を崩して仕事に行けなかった。', 'まだ給料が入ってない。入ったら連絡する。',
      '引っ越しでお金がかかった。少し待って。', '今月だけは無理。来月は必ず払う。',
      '連絡しようと思ってた。もう少し待って。', '会社からの振込が遅れてる。',
      '車の修理代が必要だった。来月払う。', '何度も言われなくても分かってる。',
      '今、手続き中。終わったら振り込む。', '今月分は来月と一緒にする。',
      'こっちにも生活がある。少しは考えて。', '忙しくて銀行に行けなかった。',
      '週末までには何とかする。'
    ];
    const progressKey = 'child-support-and-love-progress';
    const getProgress = () => Math.max(0, Math.min(months.length, Number(localStorage.getItem(progressKey) || 0)));
    const setProgress = value => localStorage.setItem(progressKey, String(Math.max(getProgress(), value)));
    const hint = document.getElementById('hint');

    class BankbookScene extends Phaser.Scene {
      constructor() { super('bankbook'); }
      init(data) { this.requestedYear = data.year; }
      create() {
        hint.textContent = '通帳の明細から、次の月を選んでください。';
        this.cameras.main.setBackgroundColor('#d8d0bd');
        const progress = getProgress();
        const activeYear = months[Math.min(progress, months.length - 1)].year;
        this.pageYear = this.requestedYear || activeYear;
        const pageMonths = months.map((entry, index) => ({ ...entry, index })).filter(entry => entry.year === this.pageYear);

        this.add.rectangle(195, 350, 370, 674, 0xf4efdf).setStrokeStyle(2, 0xa9a18e);
        this.add.rectangle(195, 48, 370, 76, 0x263d56);
        this.add.text(30, 37, '普通預金 通帳', { fontFamily: 'serif', fontSize: '21px', color: '#fffaf0', letterSpacing: 3 });
        this.add.text(360, 41, String(this.pageYear - 2015).padStart(2, '0'), { fontFamily: 'monospace', fontSize: '15px', color: '#b9c6d1' }).setOrigin(1, 0);
        this.add.text(36, 102, '年月', this.headerStyle());
        this.add.text(186, 102, '金額', this.headerStyle()).setOrigin(1, 0);
        this.add.text(223, 102, '摘要', this.headerStyle());
        this.add.text(354, 102, '累計', this.headerStyle()).setOrigin(1, 0);
        this.add.line(195, 128, -166, 0, 166, 0, 0x857d6e).setOrigin(.5);

        pageMonths.forEach((entry, rowIndex) => {
          const index = entry.index;
          const y = 155 + rowIndex * 40;
          const complete = index < progress, available = index <= progress;
          const selected = index === progress && progress < months.length;
          const row = this.add.rectangle(195, y, 334, 36, selected ? 0xead4cc : 0xffffff, selected ? .9 : .001);
          if (available) row.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.scene.start('message', { index }));
          const color = available ? '#2a3036' : '#aaa496';
          this.add.text(36, y, `${String(entry.month).padStart(2, '0')}月`, { fontFamily: 'sans-serif', fontSize: '17px', color }).setOrigin(0, .5);
          this.add.text(186, y, complete ? '30,000' : '—', { fontFamily: 'monospace', fontSize: '16px', color: complete ? '#263d56' : color }).setOrigin(1, .5);
          this.add.text(223, y, complete ? '振込' : selected ? '未入金' : '', { fontFamily: 'serif', fontSize: '16px', color: complete ? '#596675' : '#9b3f3f' }).setOrigin(0, .5);
          this.add.text(354, y, complete ? `${((index + 1) * 30000 / 10000).toFixed(0)}万` : '', { fontFamily: 'monospace', fontSize: '15px', color: '#4b545d' }).setOrigin(1, .5);
          this.add.line(195, y + 20, -166, 0, 166, 0, 0xc8c0af).setOrigin(.5);
        });

        const years = [2016, 2017, 2018];
        years.forEach((year, i) => {
          const enabled = months.findIndex(item => item.year === year) <= progress;
          const tab = this.add.rectangle(82 + i * 113, 654, 101, 48, year === this.pageYear ? 0x263d56 : 0xe5decd)
            .setStrokeStyle(1, 0xa9a18e);
          const label = this.add.text(82 + i * 113, 654, String(year), { fontFamily: 'monospace', fontSize: '17px', color: year === this.pageYear ? '#fffaf0' : enabled ? '#343b42' : '#aaa496' }).setOrigin(.5);
          if (enabled) {
            tab.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.scene.restart({ year }));
            label.setInteractive({ useHandCursor: true }).on('pointerdown', () => this.scene.restart({ year }));
          }
        });
      }
      headerStyle() { return { fontFamily: 'serif', fontSize: '15px', color: '#514b42' }; }
    }

    class MessageScene extends Phaser.Scene {
      constructor() { super('message'); }
      init(data) { this.stageIndex = data.index ?? 0; this.sent = false; }
      create() {
        const entry = months[this.stageIndex];
        hint.textContent = 'できることは、送信ボタンを押すことだけです。';
        this.cameras.main.setBackgroundColor('#e7eaed');
        this.add.rectangle(195, 48, 390, 96, 0xf7f8fa);
        this.add.circle(195, 31, 18, 0x8a929a);
        this.add.text(195, 61, '相手', { fontFamily: 'sans-serif', fontSize: '17px', color: '#222b33' }).setOrigin(.5);
        this.add.text(195, 91, entry.label, { fontFamily: 'sans-serif', fontSize: '14px', color: '#7b8288' }).setOrigin(.5);
        this.add.line(195, 96, -195, 0, 195, 0, 0xc8cdd1).setOrigin(.5);
        this.status = this.add.text(367, 504, '', { fontFamily: 'sans-serif', fontSize: '13px', color: '#7b8288' }).setOrigin(1, .5);
        this.sendButton = this.add.rectangle(195, 652, 342, 62, 0x3976a8).setStrokeStyle(1, 0x2b638f).setInteractive({ useHandCursor: true });
        this.sendLabel = this.add.text(195, 652, '催促する', { fontFamily: 'sans-serif', fontSize: '19px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(.5);
        this.sendButton.on('pointerdown', () => this.sendReminder());
      }
      sendReminder() {
        if (this.sent) return;
        this.sent = true;
        this.sendButton.disableInteractive().setFillStyle(0x9aa5ad); this.sendLabel.setText('送信済み');
        this.bubble(374, 445, 330, 92, 0x3976a8, '今月分の養育費が、まだ\n振り込まれていません。\n確認してください。', '#ffffff', 1);
        this.time.delayedCall(850, () => this.status.setText('既読'));
        this.time.delayedCall(1450, () => {
          this.typingBubble = this.bubble(16, 292, 122, 52, 0xffffff, '●  ●  ●', '#8a929a', 0, true);
          this.tweens.add({ targets: this.typingBubble.text, alpha: .3, duration: 350, yoyo: true, repeat: -1 });
        });
        this.time.delayedCall(2750, () => {
          if (this.typingBubble) { this.typingBubble.bg.destroy(); this.typingBubble.text.destroy(); }
          this.bubble(16, 300, 342, 96, 0xffffff, excuses[this.stageIndex], '#222b33', 0);
          setProgress(this.stageIndex + 1); hint.textContent = '言い訳が届きました。次の月へ進みます。';
        });
        this.time.delayedCall(5350, () => this.scene.start('bankbook'));
      }
      bubble(x, y, width, height, color, message, textColor, originX, typing = false) {
        const bg = this.add.rectangle(x, y, width, height, color).setOrigin(originX, .5).setStrokeStyle(color === 0xffffff ? 1 : 0, 0xcdd2d6);
        const textX = originX === 1 ? x - width + 20 : x + 20;
        const text = this.add.text(textX, y, message, { fontFamily: 'sans-serif', fontSize: typing ? '14px' : '16px', color: textColor, lineSpacing: 7, wordWrap: { width: width - 40 } }).setOrigin(0, .5);
        return { bg, text };
      }
    }
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
    new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: WIDTH,
      height: HEIGHT,
      resolution: pixelRatio,
      backgroundColor: '#e9e2d2',
      scene: [BankbookScene, MessageScene],
      render: {
        antialias: true,
        antialiasGL: true,
        pixelArt: false,
        roundPixels: true
      },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    });
  </script>
</body>
</html>
